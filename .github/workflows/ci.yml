name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Backend & Model Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric==2.8.0.post1 torch-scatter==2.1.2+pt26cpu --extra-index-url https://data.pyg.org/whl/torch-2.6.0+cpu.html
          pip install biopython fastapi uvicorn pydantic pytest httpx ruamel.yaml
          pip install -e . --no-deps

      - name: Run pytest test suite
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build
        run: |
          cd apps/frontend
          npm install
          npm run build
